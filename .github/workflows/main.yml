name: NHL News Bot
on:
  workflow_dispatch: # Запускается только по сигналу от watcher.yml или вручную

permissions:
  contents: write

concurrency:
  group: nhl-news-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python nhl_bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}

      - name: Commit bot state
        run: |
          python -c "import sqlite3; c=sqlite3.connect('nhl_bot.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          rm -f nhl_bot.db-wal nhl_bot.db-shm

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add nhl_bot.db

          if ! git diff --staged --quiet; then
            git commit -m "Update bot state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Состояние не изменилось, пушить нечего."
          fi
