name: NHL Feed Watcher

on:
  schedule:
    # 16:00 - 23:50 по Украине -> каждые 10 минут
    - cron: '*/10 16-23 * * *'
      timezone: Europe/Kyiv

    # 00:00 - 10:50 по Украине -> каждые 10 минут
    - cron: '*/10 0-10 * * *'
      timezone: Europe/Kyiv

    # 11:00 - 15:30 по Украине -> каждые 30 минут
    - cron: '0,30 11-15 * * *'
      timezone: Europe/Kyiv

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check_feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Check RSS for new entries
        id: check_rss
        run: python check_rss.py

      - name: Trigger NHL News Bot
        if: steps.check_rss.outputs.NEW_NEWS == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main"}'
